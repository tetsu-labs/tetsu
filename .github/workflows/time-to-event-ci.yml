name: Time-to-Event CI

on:
  push:
    branches: [master]
    paths:
      - "time-to-event-analysis-platform/**"
      - ".github/workflows/time-to-event-ci.yml"
  pull_request:
    paths:
      - "time-to-event-analysis-platform/**"
      - ".github/workflows/time-to-event-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: time-to-event-analysis-platform/backend
    env:
      DATABASE_URL: sqlite:///./ci_app.db
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Alembic upgrade / downgrade / upgrade
        run: |
          rm -f ci_app.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: time-to-event-analysis-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: time-to-event-analysis-platform/infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  public-dataset-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - name: Install Python dependencies
        run: pip install -r time-to-event-analysis-platform/backend/requirements.txt
      - name: Ensure R survival package
        run: Rscript -e 'if (!requireNamespace("survival", quietly=TRUE)) install.packages("survival", repos="https://cloud.r-project.org")'
      - name: Generate R reference metrics from public NCCTG lung data
        working-directory: time-to-event-analysis-platform
        run: Rscript validation/reference_lung.R
      - name: Cross-check Python platform against R survival
        working-directory: time-to-event-analysis-platform
        env:
          PYTHONPATH: backend
        run: python validation/validate_lung.py

  docker-compose-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: time-to-event-analysis-platform
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          set -euxo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Smoke test auth and analysis
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, urllib.request
          def post(path, payload, token=None):
              data = json.dumps(payload).encode()
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(
                  "http://127.0.0.1:8000" + path,
                  data=data, headers=headers, method="POST",
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  return json.load(r)
          token = post("/auth/register", {
              "email": "smoke@example.com",
              "password": "password123"
          })["access_token"]
          project = post("/projects", {
              "name": "Smoke", "domain": "server", "config": {}, "data": []
          }, token)
          result = post("/api/analyze", {
              "records": [
                  {"time": 5, "event": 1, "group": "A"},
                  {"time": 8, "event": 0, "group": "A"},
                  {"time": 4, "event": 1, "group": "B"},
                  {"time": 9, "event": 1, "group": "B"}
              ],
              "time_col": "time", "event_col": "event",
              "group_col": "group", "covariates": [], "seed": 12345
          })
          assert project["id"] > 0
          assert result["n"] == 4
          assert result["events"] == 3
          print("Smoke test passed")
          PY
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Stop stack
        if: always()
        run: docker compose down -v
