name: Time-to-Event Docker Smoke

on:
  push:
    branches: [master]
    paths:
      - "time-to-event-analysis-platform/**"
      - ".github/workflows/time-to-event-docker-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: time-to-event-analysis-platform
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up --build -d

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs backend
          exit 1

      - name: Check frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs frontend
          exit 1

      - name: Show services
        run: docker compose ps

      - name: Shutdown
        if: always()
        run: docker compose down -v
