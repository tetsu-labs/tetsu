services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tte
      POSTGRES_USER: tte
      POSTGRES_PASSWORD: tte
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U tte -d tte"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tte:tte@db:5432/tte
      JWT_SECRET: local-dev-secret-change-me
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
